name: Build, test, and package renderer

on:
  push:
    branches:
      - master
      - development
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the verified package to NuGet.org'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@6df8cefd1440cf9313e76b8fdb8aaf90cfa745a3 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore TheSingularityWorkshop.Renderer.slnx
      - name: Build
        run: dotnet build TheSingularityWorkshop.Renderer.slnx --configuration Release --no-restore
      - name: Test with coverage
        run: >
          dotnet test TheSingularityWorkshop.Renderer.slnx
          --configuration Release
          --no-build
          --verbosity normal
          --collect:"XPlat Code Coverage;Format=cobertura"
          --results-directory ./TestResults
          --logger "trx;LogFileName=testresults.trx"
      - name: Prove opt-in FSM_COS rendering composition
        run: dotnet run --project samples/FsmCosRendering/FsmCosRendering.csproj --configuration Release
      - name: Prove FSM_COS composition without rendering dependencies
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project samples/FsmCosWithoutRendering/FsmCosWithoutRendering.csproj --configuration Release
          deps_file="samples/FsmCosWithoutRendering/bin/Release/net8.0/FsmCosWithoutRendering.deps.json"
          if grep -Eqi 'TheSingularityWorkshop.Renderer|TheSingularityWorkshop.Visualize|GUI[.]SVG' "$deps_file"; then
            echo "The rendering-free consumer unexpectedly references a rendering assembly."
            exit 1
          fi
          echo "PASS: rendering-free consumer dependency manifest contains no Renderer, Visualize, or GUI.SVG assembly."
      - name: Prepare coverage report
        shell: bash
        run: |
          set -euo pipefail
          coverage_file="$(find ./TestResults -type f -name 'coverage.cobertura.xml' -print -quit)"
          if [[ -z "$coverage_file" ]]; then
            echo "No coverage.cobertura.xml file was produced."
            find ./TestResults -maxdepth 4 -type f -print || true
            exit 1
          fi
          cp "$coverage_file" ./TestResults/coverage.cobertura.xml
      - name: Check whether Codecov upload is configured
        id: codecov-config
        shell: bash
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [[ -n "$CODECOV_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "CODECOV_TOKEN is not configured; coverage upload will be skipped. Coverage files remain available as workflow artifacts."
          fi
      - name: Upload coverage to Codecov
        if: ${{ steps.codecov-config.outputs.enabled == 'true' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: TrentBest/TheSingularityWorkshop.Renderer
          files: ./TestResults/coverage.cobertura.xml
          fail_ci_if_error: true
      - name: Regenerate living Renderer documentation SVGs
        run: |
          dotnet run --project samples/LivingRenderer/LivingRenderer.csproj --configuration Release -- docs/assets/living-event-horizons.svg
          dotnet run --project samples/RenderFrameSvgProof/RenderFrameSvgProof.csproj --configuration Release -- docs/assets/render-frame-inspector.svg
      - name: Verify living SVGs are reproducible
        run: git diff --exit-code -- docs/assets/living-event-horizons.svg docs/assets/render-frame-inspector.svg
      - name: Generate observer-driven policy-to-frame proof
        run: |
          dotnet run --project samples/ObserverDrivenFrameProof/ObserverDrivenFrameProof.csproj --configuration Release -- artifacts/observer-driven-frame-proof.svg 0 50
          dotnet run --project samples/ObserverDrivenFrameProof/ObserverDrivenFrameProof.csproj --configuration Release -- artifacts/observer-driven-frame-proof-reversed.svg 50 0
      - name: Generate bucket invalidation and reuse proof
        run: dotnet run --project samples/BucketInvalidationReuseProof/BucketInvalidationReuseProof.csproj --configuration Release -- artifacts/bucket-invalidation-reuse-proof.svg
      - name: Generate observer-to-bucket frame proof
        run: dotnet run --project samples/ObserverBucketFrameProof/ObserverBucketFrameProof.csproj --configuration Release -- artifacts/observer-bucket-frame-proof.svg 0 50
      - name: Upload observer-to-bucket frame proof
        uses: actions/upload-artifact@c2acdedd35a8824a1552c7137f8c18288c3ea469 # v7.0.2
        with:
          name: renderer-observer-bucket-frame-proof
          path: artifacts/observer-bucket-frame-proof.svg
      - name: Upload bucket invalidation and reuse proof
        uses: actions/upload-artifact@c2acdedd35a8824a1552c7137f8c18288c3ea469 # v7.0.2
        with:
          name: renderer-bucket-invalidation-reuse-proof
          path: artifacts/bucket-invalidation-reuse-proof.svg
      - name: Upload observer-driven frame proof
        uses: actions/upload-artifact@c2acdedd35a8824a1552c7137f8c18288c3ea469 # v7.0.2
        with:
          name: renderer-observer-driven-frame-proof
          path: artifacts/observer-driven-frame-proof*.svg
      - name: Pack
        run: dotnet pack TheSingularityWorkshop.Renderer.csproj --configuration Release --no-build --output ./artifacts
      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@c2acdedd35a8824a1552c7137f8c18288c3ea469 # v7.0.2
        with:
          name: renderer-nuget-package
          path: ./artifacts/*.nupkg
      - name: Upload test and coverage artifacts
        uses: actions/upload-artifact@c2acdedd35a8824a1552c7137f8c18288c3ea469 # v7.0.2
        with:
          name: renderer-test-results
          path: ./TestResults/*
  repository-source-integration:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: Workshop/TheSingularityWorkshop.Renderer
      - name: Checkout FSM_API development
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TrentBest/FSM_API
          ref: development
          path: Workshop/FSM_API
      - name: Checkout ProtocolAi development
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TrentBest/TheSingularityWorkshop.ProtocolAi
          ref: development
          path: Workshop/TheSingularityWorkshop.ProtocolAi
      - name: Checkout MicroBundleDomain development
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TrentBest/TheSingularityWorkshop.MicroBundleDomain
          ref: development
          path: Workshop/TheSingularityWorkshop.MicroBundleDomain
      - name: Setup .NET
        uses: actions/setup-dotnet@6df8cefd1440cf9313e76b8fdb8aaf90cfa745a3 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Restore from sibling repository sources
        run: dotnet restore Workshop/TheSingularityWorkshop.Renderer/TheSingularityWorkshop.Renderer.slnx -p:WorkshopUseRepositorySources=true
      - name: Build from sibling repository sources
        run: dotnet build Workshop/TheSingularityWorkshop.Renderer/TheSingularityWorkshop.Renderer.slnx --configuration Release --no-restore -p:WorkshopUseRepositorySources=true
      - name: Test from sibling repository sources
        run: dotnet test Workshop/TheSingularityWorkshop.Renderer/TheSingularityWorkshop.Renderer.slnx --configuration Release --no-build --verbosity normal -p:WorkshopUseRepositorySources=true

  publish_nuget:
    needs: build-and-test
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/development' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download NuGet package
        uses: actions/download-artifact@e455989ae00f5bdd4054f05d3e972c6bf8a62dc5 # v8.0.2
        with:
          name: renderer-nuget-package
          path: ./artifacts
      - name: Authenticate with NuGet Trusted Publishing
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: TheSingularityWorkshop
      - name: Publish package to NuGet.org
        run: dotnet nuget push "./artifacts/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate
