<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Living Event Horizons — FSM_API representation states</title>
  <desc id="desc">A generated snapshot of five RendererComputationMachine instances after FSM_API advances each instance into its requested representation. The SVG adds presentation-only motion to the resulting state markers.</desc>
  <defs><linearGradient id="field" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071a2c"/><stop offset="1" stop-color="#030711"/></linearGradient><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1000" height="360" rx="18" fill="url(#field)"/>
  <text x="36" y="38" fill="#f5f8ff" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">One entity identity. Different computational responsibilities.</text>
  <text x="36" y="61" fill="#9cb5ce" font-family="Segoe UI, sans-serif" font-size="12">Generated by running RendererComputationMachine → FSM_API → CurrentRepresentation</text>
  <path d="M110 142 H890" stroke="#46708d" stroke-width="2" stroke-dasharray="5 7" opacity=".8"/>
  <g class="node node-semantic" transform="translate(110 142)" role="img" aria-label="Landmark identity: Semantic representation">
    <circle r="7" fill="#9ba9bc" stroke="#e0e8f4" stroke-width="1.5"/>
    <text x="0" y="48" text-anchor="middle" fill="#f5f8ff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">Semantic</text>
    <text x="0" y="67" text-anchor="middle" fill="#9cb5ce" font-family="Segoe UI, sans-serif" font-size="10">Landmark identity</text>
  </g>
  <g class="node node-aggregate" transform="translate(305 142)" role="img" aria-label="Environmental mass: Aggregate representation">
    <circle r="15" fill="#1a4b61" stroke="#63d8f2" stroke-width="2"/><circle r="5" fill="#9be9ff"/>
    <text x="0" y="48" text-anchor="middle" fill="#f5f8ff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">Aggregate</text>
    <text x="0" y="67" text-anchor="middle" fill="#9cb5ce" font-family="Segoe UI, sans-serif" font-size="10">Environmental mass</text>
  </g>
  <g class="node node-distant" transform="translate(500 142)" role="img" aria-label="Distant presence: Distant representation">
    <rect x="-13" y="-13" width="26" height="26" rx="4" fill="#174e89" stroke="#69aaff" stroke-width="2"/><path d="M-7 4 L0 -5 L7 4" fill="none" stroke="#d3e8ff" stroke-width="2"/>
    <text x="0" y="48" text-anchor="middle" fill="#f5f8ff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">Distant</text>
    <text x="0" y="67" text-anchor="middle" fill="#9cb5ce" font-family="Segoe UI, sans-serif" font-size="10">Distant presence</text>
  </g>
  <g class="node node-near" transform="translate(695 142)" role="img" aria-label="Near detail: Near representation">
    <path d="M0 -20 L-15 5 H-6 L-12 17 H12 L6 5 H15 Z" fill="#b77a24" stroke="#ffcf74" stroke-width="2"/><path d="M0 17 V24" stroke="#ffcf74" stroke-width="3"/>
    <text x="0" y="48" text-anchor="middle" fill="#f5f8ff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">Near</text>
    <text x="0" y="67" text-anchor="middle" fill="#9cb5ce" font-family="Segoe UI, sans-serif" font-size="10">Near detail</text>
  </g>
  <g class="node node-interactive" transform="translate(890 142)" role="img" aria-label="Interactive detail: Interactive representation">
    <circle class="pulse" r="27" fill="none" stroke="#ffe7a0" stroke-width="2"/><path d="M0 -22 L-17 5 H-7 L-13 18 H13 L7 5 H17 Z" fill="#e4ad34" stroke="#fff0b5" stroke-width="2.5" filter="url(#glow)"/><path d="M0 18 V25" stroke="#fff0b5" stroke-width="3"/>
    <text x="0" y="48" text-anchor="middle" fill="#f5f8ff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">Interactive</text>
    <text x="0" y="67" text-anchor="middle" fill="#9cb5ce" font-family="Segoe UI, sans-serif" font-size="10">Interactive detail</text>
  </g>
  <path d="M36 292 H964" stroke="#27465f" stroke-width="1"/>
  <text x="36" y="315" fill="#b7cbe0" font-family="Segoe UI, sans-serif" font-size="12">State changes are real FSM_API transitions. Glow/pulse is SVG presentation only; this image is a generated snapshot, not a live process monitor.</text>
  <text x="36" y="337" fill="#6e91ad" font-family="Consolas, monospace" font-size="11">Rebuild: dotnet run --project samples/LivingRenderer -- docs/assets/living-event-horizons.svg</text>
  <style>@keyframes breathe{0%,100%{opacity:.45;transform:scale(.92)}50%{opacity:1;transform:scale(1.12)}}.pulse{transform-box:fill-box;transform-origin:center;animation:breathe 3s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.8}}</style>
</svg>
